# Cloudflare Pages config for AeroNotes (static site + comment API)
name = "aeronotesblog"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[vars]
# Main public address (pages.dev is blocked in Turkey); used for canonical links and the sitemap
SITE_URL = "https://aeronotesblog.netlify.app"

[[d1_databases]]
binding = "DB"
database_name = "aeronotes-comments"
database_id = "c8203ca9-5ebe-4958-a957-c9ea28d03fbc"
