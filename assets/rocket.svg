<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2846"/>
      <stop offset="0.55" stop-color="#5d6f97"/>
      <stop offset="1" stop-color="#e8b993"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.82" r="0.4">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3b0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8bfc9"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.4" stop-color="#ffc95a"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- launch tower -->
  <g stroke="#1a1f2b" stroke-width="3" fill="none">
    <path d="M520 450 L530 110 M556 450 L548 110"/>
    <path d="M522 420 L554 395 M522 395 L554 420 M523 360 L553 335 M523 335 L553 360 M525 300 L551 275 M525 275 L551 300 M526 240 L550 215 M526 215 L550 240 M527 180 L549 155 M527 155 L549 180 M528 130 L548 112"/>
    <path d="M530 110 L548 110 M539 110 L539 80"/>
    <path d="M548 190 L470 190 M548 250 L478 250" stroke-width="4"/>
  </g>
  <!-- flame -->
  <ellipse cx="400" cy="345" rx="22" ry="70" fill="url(#flame)" filter="url(#soft)"/>
  <ellipse cx="400" cy="320" rx="12" ry="40" fill="#fffbe8"/>
  <!-- rocket -->
  <path d="M385 300 L385 120 Q400 70 415 120 L415 300 Z" fill="url(#body)"/>
  <rect x="385" y="160" width="30" height="6" fill="#23324f"/>
  <rect x="385" y="260" width="30" height="5" fill="#23324f"/>
  <path d="M385 270 L372 305 L385 300 Z M415 270 L428 305 L415 300 Z" fill="#7f8896"/>
  <!-- smoke -->
  <g fill="#f3ece6" filter="url(#soft)" opacity="0.95">
    <ellipse cx="400" cy="430" rx="160" ry="45"/>
    <ellipse cx="300" cy="440" rx="120" ry="40"/>
    <ellipse cx="500" cy="440" rx="130" ry="40"/>
    <ellipse cx="400" cy="400" rx="70" ry="35"/>
  </g>
</svg>
