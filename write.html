<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write · AeroNotes</title>
  <meta name="description" content="AeroNotes — a student blog on aerospace and space by Umutcan Bakırcı.">
  <meta name="author" content="Umutcan Bakırcı">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="write">
<header class="site-header" id="site-header"></header>
<main class="container editor">
  <form id="writeForm" autocomplete="off" onsubmit="return false">
    <div class="ed-bar">
      <span class="hint" id="saveState">Taslak otomatik kaydedilir</span>
      <span class="ed-actions">
        <a class="btn ghost" href="manage.html" id="modLink">📋 Yönetim</a>
        <button class="btn ghost" type="button" id="previewBtn">Önizle</button>
        <button class="btn" type="button" id="publishBtn">Yayınla</button>
      </span>
    </div>
    <p id="publishMsg" class="hint ed-msg"></p>

    <div id="editPane">
      <input class="ed-title" name="title" placeholder="Başlık" aria-label="Başlık">

      <div class="ed-label">Kategori</div>
      <div class="ed-chips" id="cats"></div>

      <div class="ed-label">Kapak</div>
      <div class="ed-covers" id="covers"></div>

      <div class="ed-label">Yazı tipi</div>
      <div class="ed-chips ed-fonts" id="fonts"></div>

      <div class="ed-toolbar" id="toolbar" aria-label="Biçimlendirme">
        <button type="button" data-md="h" title="Ara başlık">Başlık</button>
        <button type="button" data-md="b" title="Kalın (Ctrl+B)"><b>K</b></button>
        <button type="button" data-md="i" title="İtalik (Ctrl+I)"><i>İ</i></button>
        <button type="button" data-md="u" title="Altı çizili (Ctrl+U)"><u>A</u></button>
        <button type="button" data-md="ul" title="Liste">• Liste</button>
        <button type="button" data-md="q" title="Alıntı">❝ Alıntı</button>
        <button type="button" data-md="a" title="Link">🔗 Link</button>
        <span class="tb-sep"></span>
        <button type="button" data-md="img" title="Yazının içine fotoğraf ekle">📷 Fotoğraf</button>
        <button type="button" data-md="video" title="Yazının içine video ekle">🎬 Video</button>
      </div>
      <div class="ed-pop" id="videoPop" hidden>
        <b>Video ekle</b>
        <div class="row-inline"><input id="videoUrl" placeholder="YouTube linkini yapıştır (https://youtube.com/…)"><button type="button" class="btn" id="videoUrlBtn">Ekle</button></div>
        <div class="hint">ya da</div>
        <button type="button" class="btn ghost" id="videoFileBtn">💻 Bilgisayardan video yükle (en fazla 25 MB)</button>
        <button type="button" class="ed-pop-x" id="videoPopX" aria-label="Kapat">✕</button>
      </div>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <input type="file" id="vidFile" accept="video/mp4,video/webm,video/quicktime" hidden>
      <div class="ed-body prose" id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="İçerik" data-placeholder="Yazmaya başla…"></div>

      <details class="ed-more">
        <summary>Diğer ayarlar</summary>
        <div class="field"><label for="excerpt">Kısa özet <span class="hint">(boş bırakırsan otomatik oluşur)</span></label><input id="excerpt" name="excerpt"></div>
        <div class="field"><label for="date">Tarih</label><input id="date" name="date" type="date"></div>
        <p class="hint"><a href="login.html?setup">Parolayı değiştir</a></p>
      </details>
    </div>
  </form>
  <article id="previewPane" hidden></article>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/posts.js"></script>
<script src="js/main.js"></script>
</body>
</html>
